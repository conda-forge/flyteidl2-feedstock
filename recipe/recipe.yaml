schema_version: 1

context:
  version: "2.0.57"

package:
  name: flyteidl2
  version: ${{ version }}

source:
  # PyPI only has a wheel. The package is built from gen/python in the flyte repo.
  url: https://github.com/flyteorg/flyte/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7ee303ab04cbe607c193838827f6d7ca532f3e5c5bb4b236c848bd5b5e3684ec
  patches:
    # Upstream vendors generated buf/validate code that clashes with the
    # protovalidate package; depend on protovalidate for it instead.
    - use-protovalidate-buf.patch

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      # license-files in gen/python/pyproject.toml expects LICENSE next to it;
      # the file lives at the repo root.
      - if: unix
        then: cp LICENSE gen/python/LICENSE
        else: copy LICENSE gen\python\LICENSE
      - ${{ PYTHON }} -m pip install ./gen/python -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - googleapis-common-protos
    - protoc-gen-openapiv2
    - protobuf >=4.21.1
    # protovalidate 2 moved to the protobuf-py runtime and no longer provides
    # buf.validate.validate_pb2, which flyteidl2 imports (see the patch).
    - protovalidate >=1.0.0,<2

tests:
  - python:
      imports:
        - flyteidl2
        - flyteidl2.common.identifier_pb2
        - flyteidl2.core.tasks_pb2
        - flyteidl2.task.task_definition_pb2
        - flyteidl2.workflow.run_definition_pb2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      recipe:
        - run_test.py
    script:
      - python run_test.py

about:
  homepage: https://flyte.org
  repository: https://github.com/flyteorg/flyte
  summary: Protobuf IDL for Flyte
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
